services:
  db:
    image: postgres:17-alpine
    container_name: kumon_management_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 30012004
      POSTGRES_DB: kumon_management_local_2026
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kumon_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kumon_management_local_2026"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kumon_management_app
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:30012004@db:5432/kumon_management_local_2026
    volumes:
      - ./docker-data/temp:/app/temp
      - ./docker-data/certificates:/app/certificates
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kumon_network
    restart: always

networks:
  kumon_network:
    driver: bridge
